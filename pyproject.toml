[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tdcladder"
version = "0.2.0"
description = "Liquidity-weighted Treasury supply ladder and TDC companion measurement toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "openpyxl",
  "pandas",
  "pyyaml",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]
analysis = [
  "matplotlib",
]

[project.scripts]
tdcladder = "tdcladder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
