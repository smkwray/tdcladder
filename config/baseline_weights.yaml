metadata:
  interpretation: >
    Fixed weights are transparent measurement assumptions for a moneyness ladder.
    They are not structural estimates. Sensitivity families are included by design.
  unit_interval: true
  duration_guardrail: >
    Long-duration securities remain low-moneyness even when market trading volume is high.

weight_ladders:
  fixed_baseline:
    description: >
      Project-1 starter ladder: bills high, FRNs/short coupons intermediate, long coupons low.
    maturity_bucket_weights:
      0_3m: 0.98
      3_6m: 0.94
      6_12m: 0.88
